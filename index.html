<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#0c0b10;
  --bg-alt:#131219;
  --card:#17151f;
  --white:#fff;
  --text:#f3f1f7;
  --muted:#9591a3;
  --border:#2a2733;
  --gold:#d4af37;
  --gold-bright:#f2d375;
  --silver:#c7c9d1;
  --bronze:#b8793a;
  --pitch:#2f9e6e;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
}

h1,h2,h3,.cta-btn,.logo-title,.flat-price{
  font-family:'Oswald','Inter',sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  padding-bottom:60px;
}

header{
  position:relative;
  text-align:center;
  padding:56px 20px 32px;
  border-bottom:1px solid var(--border);
  overflow:hidden;
  background:
    repeating-linear-gradient(
      118deg,
      rgba(212,175,55,.09) 0px,
      rgba(212,175,55,.09) 2px,
      transparent 2px,
      transparent 46px
    ),
    var(--bg);
}

.logo-title{
  font-size:2.75rem;
  font-weight:700;
  letter-spacing:4px;
  text-transform:uppercase;
  background:linear-gradient(90deg,#fff 0%,#f0e6c8 55%,var(--gold) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.tagline{
  font-size:.85rem;
  letter-spacing:5px;
  color:var(--gold);
  text-transform:uppercase;
  margin-top:8px;
  font-weight:600;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.hero{
  text-align:center;
  margin:30px 0;
  padding:28px 24px;
  background:var(--bg-alt);
  border-radius:14px;
  border:1px solid var(--border);
}

.hero h2{
  font-size:1.3rem;
  margin-bottom:10px;
  letter-spacing:.5px;
  text-transform:uppercase;
}

.hero p{
  color:var(--muted);
}

.cta-btn{
  display:inline-block;
  margin-top:16px;
  padding:13px 30px;
  background:linear-gradient(90deg,var(--gold-bright),var(--gold));
  color:#171208;
  text-decoration:none;
  font-weight:700;
  font-size:.95rem;
  border-radius:8px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  box-shadow:0 6px 18px -6px rgba(212,175,55,.55);
  transition:transform .15s ease, box-shadow .15s ease;
}

.cta-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 22px -6px rgba(212,175,55,.7);
}

.pricing-section{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
  margin-top:30px;
}

.card{
  position:relative;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:30px 30px 28px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  border-top:3px solid var(--accent, var(--gold));
  overflow:hidden;
}

.card--jersey{ --accent:var(--gold); }
.card--sleeve{ --accent:var(--silver); }
.card--kit{ --accent:var(--pitch); }

.card-icon{
  width:46px;
  height:46px;
  margin-bottom:14px;
  color:var(--accent, var(--gold));
}

.card-icon svg{
  width:100%;
  height:100%;
  display:block;
}

.tier-tag{
  position:absolute;
  top:16px;
  right:-38px;
  transform:rotate(38deg);
  background:var(--accent, var(--gold));
  color:#100c1c;
  font-size:.65rem;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  padding:4px 42px;
}

.card h3{
  font-size:1.4rem;
  margin-bottom:10px;
  border-bottom:1px solid var(--border);
  padding-bottom:12px;
  letter-spacing:.5px;
}

.card p{
  color:var(--muted);
  font-size:.95rem;
  margin-bottom:20px;
}
.discount-badge{
  display:inline-block;
  background:var(--accent, var(--pitch));
  color:#100c1c;
  padding:6px 12px;
  border-radius:5px;
  font-size:.75rem;
  font-weight:700;
  text-transform:uppercase;
  margin-bottom:10px;
}

.original-price{
  color:var(--muted);
  text-decoration:line-through;
  font-size:.9rem;
  margin-bottom:10px;
}

.saving{
  color:var(--pitch);
  font-size:.75rem;
  font-weight:700;
  margin-left:5px;
}

.flat-price{
  font-size:2rem;
  font-weight:800;
  margin-bottom:20px;
}

.flat-price span{
  font-size:1rem;
  font-weight:400;
  color:var(--muted);
}

.bulk-note{
  font-size:.8rem;
  color:var(--muted);
  background:#ffffff0d;
  border:1px dashed var(--border);
  border-radius:6px;
  padding:10px;
  margin-bottom:20px;
}

.price-list{
  list-style:none;
  margin-bottom:20px;
}

.price-list li{
  padding:8px 0;
  border-bottom:1px dashed var(--border);
  display:flex;
  justify-content:space-between;
  font-weight:600;
}

.badge-shipping{
  background:#ffffff1a;
  color:var(--pitch);
  text-align:center;
  padding:8px;
  border-radius:6px;
  font-weight:600;
  margin-bottom:20px;
}

.cta-btn--card{
  background:var(--accent, var(--gold));
  color:#100c1c;
  box-shadow:none;
  font-weight:700;
}

.cta-btn--card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 18px -8px var(--accent, var(--gold));
}

/* GALLERY */

.gallery-section,
.videos-section,
.reviews-section{
  margin-top:50px;
}

.gallery-section h2,
.videos-section h2,
.reviews-section h2{
  text-align:center;
  margin-bottom:10px;
  font-size:1.8rem;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  margin-bottom:25px;
  font-size:.95rem;
}

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.gallery-item{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  transition:.2s;
}

.gallery-item:hover{
  transform:translateY(-4px);
}

.gallery-item img{
  width:100%;
  height:300px;
  object-fit:cover;
  display:block;
}

.gallery-info{
  padding:15px;
}

.gallery-title{
  font-weight:700;
  font-size:1.05rem;
  margin-bottom:5px;
}

.gallery-desc{
  color:var(--muted);
  font-size:.85rem;
}

.extra-jersey{
  display:none;
}

.gallery-grid.show-all .extra-jersey{
  display:block;
}

.see-more-wrap{
  text-align:center;
  margin-top:25px;
}

.see-more-btn{
  padding:12px 28px;
  background:#fff;
  color:#000;
  border:0;
  border-radius:6px;
  font-weight:700;
  cursor:pointer;
  text-transform:uppercase;
  letter-spacing:1px;
}

/* VIDEOS */

.video-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.video-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.video-card video{
  width:100%;
  display:block;
  aspect-ratio:9/16;
  object-fit:cover;
  background:#000;
}

.video-info{
  padding:15px;
}

.video-title{
  font-weight:700;
  font-size:1.05rem;
  margin-bottom:5px;
}

.video-desc{
  color:var(--muted);
  font-size:.85rem;
}

/* EMAIL */

.email-section{
  margin-top:50px;
  text-align:center;
}

/* REVIEWS */

.review-form{
  background:var(--card);
  padding:20px;
  border-radius:12px;
  border:1px solid var(--border);
  margin-bottom:30px;
}

.review-form input,
.review-form textarea,
.review-form select{
  width:100%;
  padding:10px;
  margin:8px 0 15px;
  background:#000;
  border:1px solid var(--border);
  color:var(--text);
  border-radius:6px;
}

.review-form button{
  width:100%;
  padding:12px;
  background:#fff;
  color:#000;
  border:0;
  font-weight:bold;
  border-radius:6px;
  cursor:pointer;
}

.reviews-list{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.review-card{
  background:var(--card);
  border:1px solid var(--border);
  padding:15px 20px;
  border-radius:8px;
}

.review-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  gap:10px;
}

.reviewer-name{
  font-weight:bold;
}

.stars{
  color:var(--gold);
  white-space:nowrap;
  letter-spacing:1px;
}

.review-text{
  color:var(--muted);
  font-size:.95rem;
}

.qty-badge{
  display:inline-block;
  background:#ffffff0d;
  border:1px solid var(--border);
  color:var(--muted);
  font-size:.75rem;
  font-weight:600;
  padding:4px 10px;
  border-radius:20px;
  margin-bottom:10px;
}

.review-score{
  color:var(--muted);
  font-size:.8rem;
  margin-left:6px;
}

/* MOBILE */

@media(max-width:600px){
  .logo-title{
    font-size:2rem;
  }

  .card{
    padding:22px;
  }

  .gallery-item img{
    height:260px;
  }

  .review-header{
    align-items:flex-start;
    flex-direction:column;
    gap:3px;
  }
}
.card--plaque{--accent:var(--gold)}
.card--trophy{--accent:var(--bronze)}
.card--pack{--accent:var(--pitch)}
.awards-head{margin-top:50px;text-align:center}
.awards-head h2{font-size:1.8rem;margin-bottom:10px}
.award-picker{margin-top:30px;background:var(--bg-alt);border:1px solid var(--border);border-radius:14px;padding:28px 24px;scroll-margin-top:20px}
.award-picker h3{font-size:1.4rem;text-align:center;letter-spacing:.5px;margin-bottom:6px}
.award-group{margin-bottom:18px}
.award-group h4{font-size:.85rem;color:var(--gold);letter-spacing:1px;margin-bottom:10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.award{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;transition:background .15s,border-color .15s,color .15s}
.award:hover{border-color:var(--gold)}
.award.on{background:var(--gold);border-color:var(--gold);color:#171208}
.award--custom{border-style:dashed}
.award-name{background:none;border:0;color:inherit;font:inherit;font-size:.85rem;font-weight:500;padding:8px 14px;cursor:pointer}
.award.on .award-name{font-weight:700;padding-right:8px}
.award-step{display:none;align-items:center;gap:4px;padding-right:6px}
.award.on .award-step{display:inline-flex}
.qty-btn{width:26px;height:26px;border-radius:50%;border:0;background:rgba(23,18,8,.16);color:#171208;font-size:1rem;font-weight:700;line-height:1;cursor:pointer}
.qty-btn:hover{background:rgba(23,18,8,.28)}
.award-qty{min-width:1.3em;text-align:center;font-weight:700;font-size:.9rem}
.award-name:focus-visible,.qty-btn:focus-visible{outline:2px solid var(--gold-bright);outline-offset:-2px}
.custom-help{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.custom-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.custom-form input{flex:1;min-width:200px;padding:10px;background:#000;border:1px solid var(--border);color:var(--text);border-radius:6px}
.custom-form input:focus-visible{outline:2px solid var(--gold-bright);outline-offset:1px}
.custom-form .cta-btn{margin-top:0;padding:10px 22px}
.winner-rows{display:grid;gap:8px;margin-bottom:14px}
.winner-row{display:grid;grid-template-columns:minmax(120px,1fr) 1.4fr;gap:10px;align-items:center}
.winner-title{font-size:.85rem;font-weight:600}
.winner-row input,.club-row input[type=text]{padding:10px;background:#000;border:1px solid var(--border);color:var(--text);border-radius:6px;width:100%}
.winner-row input:focus-visible,.club-row input:focus-visible{outline:2px solid var(--gold-bright);outline-offset:1px}
.club-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.club-row input[type=text]{flex:1;min-width:180px;width:auto}
.badge-drop{display:inline-flex;align-items:center;padding:10px 16px;border:1px dashed var(--gold);color:var(--gold-bright);border-radius:6px;font-weight:600;font-size:.85rem;cursor:pointer;position:relative}
.badge-drop:hover,.badge-drop:focus-within{background:#d4af3718}
.sr-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.plaque{display:flex;align-items:center;gap:16px;margin-top:14px;padding:18px;border-radius:10px;border:2px solid var(--gold);background:linear-gradient(135deg,#1f1b12,#2b2412 50%,#1f1b12)}
.plaque-badge{flex:none;width:72px;height:72px;border-radius:50%;border:1px dashed var(--gold);background:center/contain no-repeat;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--muted)}
.plaque-award{font-family:'Oswald','Inter',sans-serif;font-size:1.1rem;letter-spacing:1px;color:var(--gold-bright)}
.plaque-name{font-size:1.3rem;font-weight:700}
.plaque-club{font-size:.8rem;color:var(--muted)}
@media(max-width:600px){.winner-row{grid-template-columns:1fr}}
.copy-fallback{width:100%;margin-top:10px;padding:10px;background:#000;border:1px solid var(--gold);color:var(--text);border-radius:6px;font:inherit;font-size:.85rem}
.copy-fallback[hidden]{display:none}
.pick-summary{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;padding:14px 16px;background:#ffffff0d;border:1px dashed var(--border);border-radius:8px;font-weight:600}
.pick-summary small{color:var(--muted);font-weight:400}
#pickPrice{font-family:'Oswald','Inter',sans-serif;font-size:1.4rem;color:var(--gold-bright)}
.pick-actions{text-align:center;margin-top:6px}
.pick-msg{min-height:1.4em;margin-top:12px;font-size:.85rem;color:var(--pitch);text-align:center}

/* KITS / AWARDS SWITCHER */
.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 6px}
.mode-tab{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--border);border-top:3px solid var(--border);border-radius:14px;padding:16px 18px;color:var(--text);cursor:pointer;transition:border-color .15s,background .15s}
.mode-tab:hover{border-color:var(--gold)}
.mode-tab:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
.mode-tab svg{width:36px;height:36px;flex:none;color:var(--muted);transition:color .15s}
.mode-tab strong{display:block;font-family:'Oswald','Inter',sans-serif;font-size:1.25rem;letter-spacing:.5px;font-weight:600}
.mode-tab small{display:block;color:var(--muted);font-size:.8rem;line-height:1.3}
.mode-tab.active{background:var(--bg-alt);border-color:var(--gold)}
.mode-tab.active svg{color:var(--gold)}
@media(max-width:600px){
  .mode-tab{flex-direction:column;text-align:center;padding:14px 10px;gap:6px}
  .mode-tab small{font-size:.72rem}
  .award-picker{padding:22px 16px}
}
@media(prefers-reduced-motion:reduce){.award,.mode-tab{transition:none}}
#past-work .container{padding:0}

/* SIZE GUIDE */
.size-guide{margin-top:50px}
.size-guide h2{text-align:center;margin-bottom:10px;font-size:1.8rem}
.size-toggle{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
.size-pill{background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 24px;border-radius:20px;font-weight:600;font-size:.9rem;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.size-pill:hover{border-color:var(--gold)}
.size-pill:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
.size-pill.active{background:var(--gold);border-color:var(--gold);color:#171208}
.size-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-top:3px solid var(--gold);border-radius:14px}
.size-wrap[hidden]{display:none}
.size-table{width:100%;border-collapse:collapse;min-width:480px;font-size:.9rem}
.size-table th,.size-table td{padding:10px 12px;text-align:center;white-space:nowrap;border-bottom:1px dashed var(--border)}
.size-table thead th{font-family:'Oswald','Inter',sans-serif;font-weight:600;letter-spacing:.5px;color:var(--gold-bright);background:var(--bg-alt);border-bottom:1px solid var(--border)}
.size-table tbody th{text-align:left;font-weight:700;position:sticky;left:0;background:var(--card)}
.size-table tr.group td{background:#ffffff0d;color:var(--gold);font-weight:700;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;text-align:left}
.size-table tbody tr:last-child th,.size-table tbody tr:last-child td{border-bottom:0}
.size-tips{margin:18px 0;padding:14px 16px 14px 34px;color:var(--muted);font-size:.85rem;background:#ffffff0d;border:1px dashed var(--border);border-radius:6px}
.size-tips li{margin-bottom:4px}
.size-tips strong{color:var(--text)}
@media(prefers-reduced-motion:reduce){.size-pill{transition:none}}

/* DELIVERY AND RETURNS */
.policy{margin-top:50px;padding-top:24px;border-top:1px solid var(--border)}
.policy h2{font-size:1.05rem;letter-spacing:1px;text-transform:uppercase;text-align:center;color:var(--muted);margin-bottom:14px}
.policy h2 small{font-size:.75rem;letter-spacing:.5px;text-transform:none;font-weight:400}
.policy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.policy h3{font-size:.9rem;color:var(--text);margin-bottom:4px;letter-spacing:.5px}
.policy p{font-size:.8rem;color:var(--muted);line-height:1.5}
.policy h3 small{font-size:.72rem;font-weight:400;color:var(--muted);letter-spacing:0}

/* TOP NOTE */
html{scroll-behavior:smooth}
.top-note{text-align:center;font-size:.8rem;color:var(--muted);margin:14px 0 0}
.top-note a{color:var(--gold-bright);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.top-note a:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;border-radius:2px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.reviews-list:not(.show-all) .extra-review{display:none}

/* AWARDS LAUNCH TEASER */
.awards-teaser{margin-top:30px}
.awards-teaser[hidden],#awardsLive[hidden]{display:none}
.teaser-card{max-width:560px;margin:0 auto;text-align:center;align-items:center}
.teaser-card .card-icon{margin:0 auto 14px}
.teaser-card h3{width:100%}
.teaser-date{font-family:'Oswald','Inter',sans-serif;font-size:1.6rem;color:var(--gold-bright)!important;margin-bottom:6px!important}
.teaser-count{color:var(--pitch)!important;font-weight:700;font-size:.85rem!important;margin-bottom:16px!important}
</style>
</head>

<body>

<header>
  <h1 class="logo-title">CLUBURA</h1>
  <div class="tagline">Live Your Style</div>
</header>
